services:

  - type: web

    name: rural-healthcare-backend

    runtime: python

    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:

      - key: PYTHON_VERSION
        value: 3.11.9

      - key: GROQ_API_KEY
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: LLM_MODEL
        value: llama-3.1-8b-instant

      - key: ALLOWED_ORIGINS
        sync: false


  - type: web

    name: rural-healthcare-frontend

    runtime: static

    rootDir: frontend

    buildCommand: ""

    staticPublishPath: .

    envVars:

      - key: VITE_API_URL
        sync: false